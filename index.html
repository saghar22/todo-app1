<!DOCTYPE html>
<html
lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>todo-app</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>فهرست کارها</h1>
            <form id="todo-form">
                <label for="todo-input">کار جدید</label>
                <input type="text" id="todo-input"
                placeholder="مثلا: خرید نان" required>
                <button type="submit">افزودن</button>
            </form>
            <div class="filters">
                <button type="button" data-filter="all">همه</button>
                <button type="button" data-filter="active">باقی‌مانده</button>
                <button type="button" data-filter="done">انجام‌شده</button>
            </div>
            <ul id="todo-list"></ul>
        </main> 
        <script src="script.js"></script>   
    </body>
</html>
